<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second brain</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="brain">
  <header>
    <span id="dot" class="dot" title="live updates"></span>
    <h1>Second brain</h1>
    <span class="meta" id="meta">pinch or +/− to zoom · drag to pan · shift-drag to rotate</span>
    <span class="spacer"></span>
    <button type="button" id="demo">Load sample week</button>
    <a class="nav" href="/viewer">Ink viewer</a>
  </header>

  <div class="brain-layout">
    <div class="brain-graphs">
      <section class="graph-pane" id="daily-pane">
        <h3>Today <span id="daily-meta" class="meta"></span>
          <span class="graph-tools">
            <button type="button" data-target="daily" data-act="out" title="Zoom out">−</button>
            <button type="button" data-target="daily" data-act="in" title="Zoom in">+</button>
            <button type="button" data-target="daily" data-act="fit" title="Fit">fit</button>
            <button type="button" data-target="daily" data-deg="-20" title="Rotate left">⟲</button>
            <button type="button" data-target="daily" data-deg="20" title="Rotate right">⟳</button>
          </span>
        </h3>
        <div class="graph-host"><canvas id="daily-canvas"></canvas></div>
        <button type="button" id="load-more" hidden>Load more</button>
      </section>
      <section class="graph-pane" id="history-pane">
        <h3>History <span id="history-meta" class="meta"></span>
          <span class="graph-tools">
            <button type="button" data-target="history" data-act="out" title="Zoom out">−</button>
            <button type="button" data-target="history" data-act="in" title="Zoom in">+</button>
            <button type="button" data-target="history" data-act="fit" title="Fit">fit</button>
            <button type="button" data-target="history" data-deg="-20" title="Rotate left">⟲</button>
            <button type="button" data-target="history" data-deg="20" title="Rotate right">⟳</button>
          </span>
        </h3>
        <div class="graph-host"><canvas id="history-canvas"></canvas></div>
      </section>
    </div>
    <aside id="side">
      <p class="kicker">Selected</p>
      <h2 id="side-title">Waiting</h2>
      <p id="side-type" class="meta">Click a node</p>
      <img id="side-image" alt="drawing" hidden>
      <dl id="side-facts"></dl>
      <p class="kicker">Neighbors</p>
      <div id="side-links"></div>
    </aside>
  </div>

  <footer id="legend"></footer>

  <script src="/static/graph.js"></script>
  <script src="/static/brain.js"></script>
</body>
</html>
